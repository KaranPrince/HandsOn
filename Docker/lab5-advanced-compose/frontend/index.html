<!DOCTYPE html>
<html>
<head>
  <title>Lab 5 Frontend</title>
</head>
<body>
  <h1>Frontend</h1>
  <pre id="out">Loading...</pre>

  <script>
    async function callApi() {
      try {
        // Use same-origin path; nginx will proxy /api/hello to backend inside Docker network
        const res = await fetch('/api/hello');
        const json = await res.json();
        document.getElementById('out').innerText = JSON.stringify(json, null, 2);
      } catch (e) {
        document.getElementById('out').innerText = 'Error: ' + e;
      }
    }

    callApi();
  </script>
</body>
</html>
