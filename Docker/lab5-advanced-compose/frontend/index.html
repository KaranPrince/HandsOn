<!DOCTYPE html>
<html>
<head>
  <title>Lab 5 Frontend</title>
</head>
<body>
  <h1>Frontend</h1>
  <div id="out">Loading...</div>

  <script>
    async function callApi() {
      try {
        const res = await fetch('http://localhost:5001/api/hello');
        const json = await res.json();
        document.getElementById('out').innerText = JSON.stringify(json, null, 2);
      } catch (e) {
        document.getElementById('out').innerText = e;
      }
    }

    callApi();
  </script>
</body>
</html>
