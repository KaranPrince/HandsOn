services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - appnet

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASS: testpass
    ports:
      - "5001:5000"
    networks:
      - appnet
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8082:80"
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:

volumes:
  dbdata:
