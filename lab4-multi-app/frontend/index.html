<!doctype html>
<html>
  <body>
    <h1>Frontend</h1>
    <div id="output">Loading...</div>

    <script>
      async function load() {
        const res = await fetch("/api/hello");
        const json = await res.json();
        document.getElementById("output").innerText = JSON.stringify(json, null, 2);
      }
      load();
    </script>
  </body>
</html>
